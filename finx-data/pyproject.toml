[project]
name = "finx-data"
version = "0.3.0"
description = "Enterprise preprocessing pipeline for ingesting and normalizing data into structured knowledge graphs"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.1.0",
    "boto3>=1.34.0",
    "atlassian-python-api>=3.41.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "qdrant-client>=1.9.0",
    "docling>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
mineru = [
    "magic-pdf[full]>=0.9.0",
]
qdrant-extra = [
    "tiktoken>=0.7.0",
]

[project.scripts]
finx-pipeline = "pipeline.cli:main"

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
