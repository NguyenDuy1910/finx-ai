display_information:
  name: FinX Agentic Bot
  description: AI-powered Confluence & Jira research assistant for FinX
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: finx-bot
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - users:read

settings:
  event_subscriptions:
    request_url: https://b998-58-186-223-5.ngrok-free.app/slack/confluence/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
