  qdrant:
    image: qdrant/qdrant:latest
    container_name: finx-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finx-network

  falkordb:
    image: falkordb/falkordb:latest
    container_name: finx-falkordb
    ports:
      - "6379:6379"  
      - "3001:3000"  # FalkorDB Browser UI (internal port 3000)
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    environment:
      - BROWSER_ENABLED=true
      - NEXTAUTH_SECRET=finx-secret-key
      - NEXTAUTH_URL=http://localhost:3001
      - SECRET_COOKIE_PASSWORD=finx-secret-cookie-password-32chars!!
      # Browser connects to the FalkorDB instance on the same container
      - FALKORDB_URI=redis://localhost:6379
      # Increase result set size so UI can render larger graphs
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT 10000 RESULTSET_SIZE 100000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  falkordb_data:
    driver: local

networks:
  finx-network:
    driver: bridge
